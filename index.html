<!doctype html>
<html lang="en" data-theme="graphite">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1d21">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lift">
  <title>Lift</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="device">
    <div class="island"></div>
    <div class="screen">
      <!-- Fake iPhone status bar (only shown on a computer) -->
      <div class="statusbar">
        <span id="clock">9:41</span>
        <span class="icons">
          <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4L15.4 3A10 10 0 0 0 .6 3L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.4-1.6a7 7 0 0 0-9.6 0l1.4 1.6c.9-.8 2.1-1.3 3.4-1.3zM8 9.4l2-2.1a3 3 0 0 0-4 0z"/></svg>
          <svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="23" height="11" rx="3" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="25" y="4" width="1.5" height="4" rx=".7" opacity=".4"/></svg>
        </span>
      </div>

      <div class="scroller" id="scroller">
        <main id="view"></main>
      </div>

      <nav class="tabbar" id="tabbar">
        <button class="tab active" data-tab="workout">
          <svg viewBox="0 0 24 24"><path d="M2 10h2V8h2v8H4v-2H2zM18 8h2v2h2v4h-2v2h-2zM7 6h3v12H7zM14 6h3v12h-3zM10 11h4v2h-4z"/></svg>
          <span>Workout</span>
        </button>
        <button class="tab" data-tab="progress">
          <svg viewBox="0 0 24 24"><path d="M4 19h16v2H4zM5 11h3v6H5zM10.5 6h3v11h-3zM16 9h3v8h-3z"/></svg>
          <span>Progress</span>
        </button>
        <button class="tab" data-tab="exercises">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zM4 11h16v2H4zM4 17h10v2H4z"/></svg>
          <span>Exercises</span>
        </button>
        <button class="tab" data-tab="history">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 1-9 9h2a7 7 0 1 0 2.05-4.95L9 9H3V3l2.64 2.64A8.97 8.97 0 0 1 12 3zm-1 4h2v5l4 2.3-1 1.7-5-3z"/></svg>
          <span>History</span>
        </button>
      </nav>

      <div id="sheet-root"></div>
      <div id="toast" class="toast"></div>
    </div>
  </div>

  <script src="data/exercises.js"></script>
  <script src="muscles.js"></script>
  <script src="progress.js"></script>
  <script src="app.js"></script>
</body>
</html>
